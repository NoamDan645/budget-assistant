<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>התקציב שלנו</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f1f5f4;
      color: #18332d;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 700px;
      margin: auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    header { padding: 20px; border-bottom: 1px solid #ddd; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 0; color: #596b65; }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 90%;
      padding: 12px 16px;
      border-radius: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .user { background: #d7f2e5; align-self: flex-start; }
    .assistant { background: #f0f2f5; align-self: flex-end; }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #ddd;
    }

    textarea {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #aebdb7;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      resize: none;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: #176c50;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    #status {
      margin: 0;
      padding: 0 16px 12px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>התקציב שלנו</h1>
      <p>רושמים הוצאות, מסדרים קטגוריות ובודקים כמה נשאר.</p>
    </header>

    <section
      id="messages"
      role="log"
      aria-label="השיחה"
      aria-live="polite"
    ></section>

    <form id="chat-form">
      <textarea
        maxlength="2000"
        id="message"
        rows="2"
        aria-label="הודעה"
        placeholder="למשל: כמה נשאר לנו החודש?"
        required
      ></textarea>
      <button id="send" type="submit">שליחה</button>
    </form>

    <p id="status" role="status"></p>
  </main>

  <script>
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message");
    const messages = document.querySelector("#messages");
    const send = document.querySelector("#send");
    const status = document.querySelector("#status");

    let threadId = sessionStorage.getItem("budget-thread");

    if (!threadId) {
      threadId = crypto.randomUUID();
      sessionStorage.setItem("budget-thread", threadId);
    }

    let busy = false;

    function addMessage(text, role) {
      const element = document.createElement("div");
      element.className = `message ${role}`;
      element.textContent = text;
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
    }

    addMessage("שלום! איזו הוצאה נרשום או מה תרצו לבדוק?", "assistant");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text || busy) return;

      busy = true;
      send.disabled = true;
      input.disabled = true;
      status.textContent = "ממתינים לתשובה…";
      addMessage(text, "user");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            thread_id: threadId
          })
        });

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();
        addMessage(data.reply, "assistant");
        input.value = "";
        status.textContent = "";
      } catch (error) {
        status.textContent =
          "לא התקבלה תשובה. לפני שליחת הוצאה שוב, בדקו אם היא כבר נשמרה.";
      } finally {
        busy = false;
        send.disabled = false;
        input.disabled = false;
      }
    });
  </script>
</body>
</html>
